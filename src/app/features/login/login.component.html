<div class="login-page">
    <!-- Background/Logo Placeholder -->
    <div class="logo-container">
        <!-- Logo Image Placeholder -->
        <!-- Logo Image -->
        <img src="/assets/aikichun-logo.png" alt="Aikichun Logo" class="nav-logo" />
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <input type="text" formControlName="code" placeholder="Type Your Code" class="code-input" />

        <button type="submit" [disabled]="isLoading() || loginForm.invalid" class="submit-btn">
            {{ isLoading() ? 'Checking...' : 'Update Progress' }}
        </button>

        <p *ngIf="errorMessage()" class="error-msg">
            {{ errorMessage() }}
        </p>
    </form>

    <!-- Footer Socials -->
    <div class="footer-socials">
        <div class="social-icon social-icon-y">Y</div>
        <div class="social-icon social-icon-tk">Tk</div>
        <div class="social-icon social-icon-ig">Ig</div>
        <div class="social-icon social-icon-fb">Fb</div>
    </div>
</div>
