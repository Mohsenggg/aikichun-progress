<div class="login-page">
    <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
            <img src="/assets/aikichun-logo.png" alt="Aikichun Logo" class="nav-logo" />
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
            <div class="form-control">
                <label class="label"><span class="label-text">Email</span></label>
                <input
                    type="email"
                    formControlName="email"
                    placeholder="you@example.com"
                    class="input input-bordered w-full"
                />
            </div>

            <div class="form-control">
                <label class="label"><span class="label-text">Password</span></label>
                <input
                    type="password"
                    formControlName="password"
                    placeholder="Your password"
                    class="input input-bordered w-full"
                />
            </div>

            <button
                type="submit"
                [disabled]="isLoading() || loginForm.invalid"
                class="btn btn-primary w-full text-white"
            >
                @if (isLoading()) {
                    <span class="loading loading-spinner loading-sm"></span>
                }
                Login
            </button>

            @if (errorMessage()) {
                <div class="alert alert-error text-sm">
                    <span>{{ errorMessage() }}</span>
                </div>
            }
        </form>

        <p class="text-center text-sm mt-4">
            Don't have an account?
            <a routerLink="/register" class="link link-primary">Register</a>
        </p>

        <!-- Footer Socials -->
        <div class="footer-socials">
            <div class="social-icon social-icon-y">Y</div>
            <div class="social-icon social-icon-tk">Tk</div>
            <div class="social-icon social-icon-ig">Ig</div>
            <div class="social-icon social-icon-fb">Fb</div>
        </div>
    </div>
</div>

@if (showActivatePopup()) {
    <app-activate-account
        [email]="activateEmail()"
        (verified)="onAccountVerified()" />
}
