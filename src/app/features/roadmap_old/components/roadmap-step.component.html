<div class="step-container" [class.locked]="isLocked">

    <!-- Locked Overlay -->
    <div *ngIf="isLocked" class="overlay-locked">
        <!-- <span class="lock-icon">🔒</span> -->
    </div>

    <!-- Main Row -->
    <div class="step-main-row">

        <!-- Left: Checkboxes -->
        <div class="checkboxes-col">
            <div class="check-group">
                <span class="check-label">Learn</span>
                <button (click)="toggle('learning')" class="check-btn" [class.check-btn-active-white]="checks.learning">
                    <span *ngIf="checks.learning">✔</span>
                </button>
            </div>
            <div class="check-group">
                <span class="check-label">Dev</span>
                <button (click)="toggle('developed')" class="check-btn"
                    [class.check-btn-active-white]="checks.developed">
                    <span *ngIf="checks.developed">✔</span>
                </button>
            </div>
            <div class="check-group">
                <span class="check-label">Skill</span>
                <button (click)="toggle('skilled')" class="check-btn" [class.check-btn-active-red]="checks.skilled">
                    <span *ngIf="checks.skilled">✔</span>
                </button>
            </div>
        </div>

        <!-- Center: Step Number & Progress -->
        <div class="step-center">
            <h2 class="step-code">{{ step.stepNumber }}</h2>
            <div class="progress-bar-container">
                <!-- Global Progress for this step is visually small in design, keeping it simple -->
                <!-- Actually design shows percentage circle? User said "Progress Bars... Show an icon... Display percentage". That was referring to Grades. -->
                <!-- For steps, design shows just check boxes and code. -->
            </div>
        </div>


        <!-- Right: Details Button -->
        <div class="step-right">
            <button class="details-btn" (click)="toggleDetails()">
                التفاصيل
            </button>
        </div>

    </div>

    <!-- Details Box (Expanded) -->
    <div *ngIf="isDetailsOpen" class="details-box">
        <div class="details-header">
            <h3>{{ step.stepName }}</h3>
            <button class="close-details" (click)="toggleDetails()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
        <p class="details-text">
            {{ step.stepDetails }}
        </p>
    </div>

    <!-- Global Progress (Optional, keeping at bottom if needed, but reducing noise) -->
    <!-- <div class="global-progress-text">{{ step.percentage }} Global</div> -->

</div>
