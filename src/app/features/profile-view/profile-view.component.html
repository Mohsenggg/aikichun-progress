<div class="profile-page">

    <!-- Greeting -->
    <div class="greeting-section">
        <div class="avatar-circle">
            {{ profile()?.name?.charAt(0) }}
        </div>
        <h1 class="greeting-title">Hi, {{ profile()?.name }}</h1>
        <p class="greeting-code">{{ profile()?.code }}</p>
    </div>

    <!-- Main Status Display (Abstract visual) -->
    <div class="status-display-container">
        <!-- Outer Ring -->
        <div class="status-ring-bg"></div>
        <!-- Inner Logic would be dynamic CSS based on progress. -->
        <div class="status-ring-progress">
        </div>

        <div class="status-text">
            <span class="status-percent">{{ progressPercentage() }}%</span>
            <span class="status-label">Skilled</span>
        </div>
    </div>

    <!-- Action -->
    <button (click)="goToRoadmap()" class="update-btn">
        <span>Update Progress</span>
        <span>→</span>
    </button>

    <button (click)="logout()" class="signout-btn">Sign
        Out</button>

    <!-- Decor for visual interest -->
    <div class="decor-container">
        <div class="decor-blob-red"></div>
        <div class="decor-blob-blue"></div>
    </div>
</div>
