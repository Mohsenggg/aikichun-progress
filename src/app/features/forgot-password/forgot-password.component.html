<div class="page">
  <div class="card bg-base-200 rounded-box shadow-xl">
    <div class="flex justify-center mb-2">
      <img src="/assets/aikichun-logo.png" alt="Aikichun" class="w-24 h-auto" />
    </div>

    @if (isSuccess()) {
      <div class="flex flex-col items-center gap-4 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-success/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h2 class="text-xl font-bold">Check your email</h2>
        <p class="text-sm text-base-content/60">
          We sent a password reset code to<br/>
          <span class="font-semibold text-base-content">{{ form.value.email }}</span>
        </p>
        <a routerLink="/reset-password" class="btn btn-primary text-white">
          Enter reset code
        </a>
        <a routerLink="/login" class="link link-primary text-sm">Back to login</a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="text-center mb-2">
          <h2 class="text-xl font-bold">Forgot password?</h2>
          <p class="text-sm text-base-content/60 mt-1">Enter your email and we'll send you a reset code.</p>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="input input-bordered w-full"
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-error text-sm">
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="isLoading() || form.invalid"
          class="btn btn-primary text-white"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          Send reset code
        </button>

        <p class="text-center text-sm">
          Remember your password?
          <a routerLink="/login" class="link link-primary">Login</a>
        </p>
      </form>
    }
  </div>
</div>
