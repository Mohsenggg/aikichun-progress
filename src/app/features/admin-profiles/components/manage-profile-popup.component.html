<div *ngIf="isOpen" class="popup-overlay">
    <div class="popup-container">
        <button (click)="onCancel()" class="close-btn">&times;</button>

        <h2 class="popup-title">
            {{ isEditMode ? 'Edit Profile' : 'Add New Profile' }}
        </h2>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="popup-form">
            <!-- Name -->
            <div>
                <label class="form-label">Player Name</label>
                <input formControlName="name" type="text" class="form-input">
            </div>

            <!-- Code -->
            <div>
                <label class="form-label">Unique Code</label>
                <input formControlName="code" type="text" class="form-input">
                <p *ngIf="profileForm.get('code')?.touched && profileForm.get('code')?.invalid" class="form-error">
                    Code is required (min 3 chars).
                </p>
            </div>

            <div *ngIf="isEditMode" class="readonly-section">
                <h3 class="readonly-title">Current Progress (Read Only)</h3>
                <div class="status-grid">
                    <div class="status-box">
                        <span class="status-label-sm">Learn</span>
                        <span class="status-value-mono">{{ initialProfile?.status?.learning || '-' }}</span>
                    </div>
                    <div class="status-box">
                        <span class="status-label-sm">Dev</span>
                        <span class="status-value-mono">{{ initialProfile?.status?.developed || '-' }}</span>
                    </div>
                    <div class="status-box">
                        <span class="status-label-sm">Skill</span>
                        <span class="status-value-mono">{{ initialProfile?.status?.skilled || '-' }}</span>
                    </div>
                </div>
            </div>

            <div class="button-row">
                <button type="button" (click)="onCancel()" class="cancel-btn">Cancel</button>
                <button type="submit" [disabled]="profileForm.invalid" class="submit-btn">Save</button>
            </div>
        </form>
    </div>
</div>
