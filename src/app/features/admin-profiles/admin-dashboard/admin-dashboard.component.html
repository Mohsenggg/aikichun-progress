<div class="admin-page">
    <header class="admin-header">
        <h1 class="title">Profiles</h1>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </header>

    <!-- Stats / Add Section -->
    <div class="stats-bar">
        <div>
            <span class="stats-label">Total Players</span>
            <span class="stats-value">{{ profiles().length }}</span>
        </div>
        <button (click)="openAddPopup()" class="add-btn">
            <span>+</span> Add New
        </button>
    </div>

    <!-- List -->
    <div class="profiles-list">
        <div *ngFor="let p of profiles()" class="profile-card">
            <div class="profile-info">
                <!-- Avatar Placeholder -->
                <div class="avatar-small">
                    {{ p.name.charAt(0) }}
                </div>
                <div>
                    <h3 class="profile-name">{{ p.name }}</h3>
                    <p class="profile-code">{{ p.code }}</p>
                </div>
            </div>

            <div class="actions-group">
                <!-- Status Dot logic? Green=Skilled, etc. Just simple text for now -->
                <span class="status-badge">
                    {{ getHighestStatus(p) }}
                </span>
                <button (click)="openEditPopup(p)" class="icon-btn">
                    ⚙️
                </button>
                <button (click)="deleteProfile(p)" class="icon-btn">
                    🗑️
                </button>
            </div>
        </div>
    </div>

    <app-manage-profile-popup [isOpen]="isPopupOpen()" [initialProfile]="selectedProfile()" (close)="closePopup()"
        (save)="handleSave($event)"></app-manage-profile-popup>
</div>
