<div class="roadmap-wrapper">

    <!-- Figma Header: Logo & User Info -->
    <header class="main-header">
        <div class="logo-container">
            <img src="assets/aikichun-logo.png" alt="Aikichun Logo" class="main-logo">
        </div>

        <div class="user-controls">
            <div class="user-info">
                <i class="fa-solid fa-circle-user avatar-icon"></i>
                <div class="user-details">
                    <span class="user-name">{{ userName() }}</span>
                    <button class="logout-link" (click)="logout()">Log Out</button>
                </div>
            </div>
        </div>

        <!-- Global Save/Changes Indicator -->
        <div class="global-actions">
            <div *ngIf="hasChanges()" class="unsaved-status">
                <span class="unsaved-dot">●</span>
                <button class="save-button" (click)="saveChanges()" [disabled]="isSaving()">
                    {{ isSaving() ? 'Saving...' : 'Save' }}
                </button>
            </div>
        </div>
    </header>

    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="error-banner">
        {{ errorMessage() }}
    </div>

    <!-- View Switcher -->
    <div [ngSwitch]="currentView()">

        <!-- 1. GRADES VIEW -->
        <app-grade-selection *ngSwitchCase="'GRADES'" [grades]="roadmapData()" [status]="draftStatus()"
            (gradeSelected)="selectGrade($event)">
        </app-grade-selection>

        <!-- 2. SECTIONS VIEW -->
        <app-section-selection *ngSwitchCase="'SECTIONS'" [grade]="selectedGrade()!"
            (sectionSelected)="selectSection($event)" (back)="goBackToGrades()">
        </app-section-selection>

        <!-- 3. LEVELS VIEW -->
        <app-level-selection *ngSwitchCase="'LEVELS'" [section]="selectedSection()!"
            (levelSelected)="selectLevel($event)" (back)="goBackToSections()">
        </app-level-selection>

        <!-- 4. STEPS VIEW -->
        <div *ngSwitchCase="'STEPS'" class="steps-view-container">

            <div class="steps-header">
                <button class="back-btn" (click)="goBackToLevels()">
                    <i class="fa-solid fa-arrow-left"></i> Back to Levels
                </button>
            </div>

            <app-roadmap-level [level]="selectedLevel()!">
                <app-roadmap-step *ngFor="let step of selectedLevel()!.steps" [step]="step"
                    [isLocked]="getVisibility(step.stepNumber) !== 'opened'" [checks]="getChecks(step.stepNumber)"
                    (toggleCheck)="handleToggle(step.stepNumber, $event)">
                </app-roadmap-step>
            </app-roadmap-level>

        </div>

    </div>

</div>
<!-- Sticky Save Bar -->
