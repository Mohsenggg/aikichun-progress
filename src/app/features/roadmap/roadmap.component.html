<div class="roadmap-page">

    <!-- Back Header -->
    <button (click)="goBack()" class="back-btn">← Back to Profile</button>

    <!-- Levels Loop -->
    <div *ngFor="let level of roadmapData">
        <app-roadmap-level [level]="level">
            <!-- Steps Loop -->
            <div *ngFor="let step of level.steps">
                <app-roadmap-step [step]="step" [isLocked]="getVisibility(step.stepNumber) === 'locked'"
                    [checks]="getChecks(step.stepNumber)"
                    (toggleCheck)="handleToggle(step.stepNumber, $event)"></app-roadmap-step>
            </div>
        </app-roadmap-level>
    </div>

    <!-- Sticky Save Bar -->
    <div class="save-bar">
        <div class="changes-info">
            <span class="changes-text">Changes: {{ changesCount() }}/2</span>
            <span *ngIf="errorMessage()" class="error-text">{{ errorMessage() }}</span>
        </div>
        <button (click)="saveChanges()" [disabled]="!hasChanges() || isSaving()" class="save-btn">
            {{ isSaving() ? 'Saving...' : 'Save Progress' }}
        </button>
    </div>
</div>
