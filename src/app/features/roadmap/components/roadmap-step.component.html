<div class="step-container" [class.locked]="isLocked">

    <!-- Locked Overlay -->
    <div *ngIf="isLocked" class="overlay-locked">
        <span class="lock-icon">🔒</span>
    </div>

    <!-- Header Row: Checkboxes + Title -->
    <div class="header-row">

        <!-- Checkboxes Column -->
        <div class="checkboxes-col">
            <div class="check-group">
                <span class="check-label">Learn</span>
                <button (click)="toggle('learning')" class="check-btn" [class.check-btn-active-white]="checks.learning">
                    <span *ngIf="checks.learning">✔</span>
                </button>
            </div>
            <div class="check-group">
                <span class="check-label">Dev</span>
                <button (click)="toggle('developed')" class="check-btn"
                    [class.check-btn-active-white]="checks.developed">
                    <span *ngIf="checks.developed">✔</span>
                </button>
            </div>
            <div class="check-group">
                <span class="check-label">Skill</span>
                <button (click)="toggle('skilled')" class="check-btn" [class.check-btn-active-red]="checks.skilled">
                    <span *ngIf="checks.skilled">✔</span>
                </button>
            </div>
        </div>

        <!-- Text Content -->
        <div class="text-content">
            <div class="step-meta">
                <span class="step-number">{{ step.stepNumber }}</span>
                <span *ngIf="isCompleted()" class="completed-mark">✓</span>
            </div>
            <h3 class="step-details">{{ step.stepDetails }}</h3>
            <p class="step-name">{{ step.stepName }}</p>
        </div>

        <!-- Arrow Icon -->
        <div class="arrow-icon">
            ←
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill" [style.width]="step.percentage"></div>
    </div>
    <div class="global-progress-text">{{ step.percentage }} Global</div>

</div>
